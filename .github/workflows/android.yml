# Builds and tests the app on GitHub's machines, so work done in a cloud
# session (which may not have the Android SDK) is still verified.
#
#   push to main      -> unit tests + signed APK (downloadable as an artifact)
#   push tag vX.Y     -> the same, then a GitHub release "NavHUD X.Y" with the
#                        APK attached and the "## App X.Y" CHANGELOG section as notes
#   Actions tab       -> "Run workflow" does the main-branch build by hand
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    permissions:
      contents: write   # only used to create the release on a tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The committed local.properties points at C:/Android (the Windows PC).
      # The runner has its own SDK; overwrite the file here only, never commit it.
      - name: Use the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Unit tests
        working-directory: android
        run: bash ./gradlew --console=plain :app:testDebugUnitTest

      - name: Signed release APK
        working-directory: android
        run: bash ./gradlew --console=plain :app:assembleRelease

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: android/app/build/reports/tests/

      - uses: actions/upload-artifact@v7
        with:
          name: NavHUD-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          apk="NavHUD-$ver.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v h="## App $ver" 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "NavHUD $ver" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "NavHUD $ver" --notes-file notes.md
          fi
