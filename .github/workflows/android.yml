# Builds and tests the app on GitHub's machines, so work done in a cloud
# session (which may not have the Android SDK) is still verified.
#
#   push to main      -> unit tests + signed APK (downloadable as an artifact);
#                        if versionName in android/app/build.gradle.kts has no
#                        release yet, publish "NavHUD X.Y" (tag vX.Y) with the APK
#                        and the "## App X.Y" CHANGELOG section as notes.
#                        So a release is just: bump versionName, push. Cloud
#                        sessions cannot push tags, so nothing depends on them.
#   push tag vX.Y     -> the same build; attaches/replaces the APK on vX.Y
#   Actions tab       -> "Run workflow" does the main-branch build by hand
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    permissions:
      contents: write   # only used to create the release on a tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The committed local.properties points at C:/Android (the Windows PC).
      # The runner has its own SDK; overwrite the file here only, never commit it.
      - name: Use the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Unit tests
        working-directory: android
        run: bash ./gradlew --console=plain :app:testDebugUnitTest

      - name: Signed release APK
        working-directory: android
        run: bash ./gradlew --console=plain :app:assembleRelease

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: android/app/build/reports/tests/

      - uses: actions/upload-artifact@v7
        with:
          name: NavHUD-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
            # Only a new version publishes; ordinary pushes leave releases alone.
            if gh release view "v$ver" >/dev/null 2>&1; then
              echo "v$ver is already released"; exit 0
            fi
          fi
          tag="v$ver"
          apk="NavHUD-$ver.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          awk -v h="## App $ver" 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "NavHUD $ver" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            # Creates tag vX.Y at this commit. A tag made with this token does
            # not start another run, so there is exactly one build per release.
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "NavHUD $ver" --notes-file notes.md \
              || gh release upload "$tag" "$apk" --clobber
          fi
